name: Lint
on:
  push:
    branches:
      - main
    paths:
    - 'src/**/*.{ts,tsx}'
    - '.github/workflows/**'
    - 'public/**'
  pull_request:
    branches:
    - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: npm run lint -c .eslintrc
